; GapM5 R7 -- self-contained M5Stack StopWatch APP
; Uses independent display-proven bikeM5 R24 boot arrangement.
[platformio]
default_envs = app_native

[env:app_native]
platform = espressif32 @ 6.12.0
board = stopwatch-native
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_ID=30
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    m5stack/M5PM1 @ 1.0.7
    m5stack/M5IOE1 @ 1.0.9
